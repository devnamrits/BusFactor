[project]
name = "busfactor"
version = "0.1.0"
description = "Know who your team can't lose — and fix it before they leave."
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["busfactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Broad excepts and silent probes (BLE001, S110) are deliberate fault
# isolation in this codebase: a broken tool or a best-effort memory write
# must never take down an answer, and probing reads fall back instead of
# killing a request. The happy paths are covered by agent/tests and the
# benchmark; every silent fallback exists to keep the product honest.
ignore = ["BLE001", "S110"]
